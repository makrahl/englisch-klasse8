# Bei jedem Push auf "main": erst Inhalte prüfen, dann auf GitHub Pages veröffentlichen.
# Findet das Prüfskript einen Fehler, wird NICHT veröffentlicht – die alte Version bleibt online.
name: Prüfen und veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Dateien holen
        uses: actions/checkout@v7

      - name: Inhalte prüfen
        run: python3 tools/validate_content.py

      - name: Pages vorbereiten
        uses: actions/configure-pages@v6

      - name: Seite hochladen
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v5
